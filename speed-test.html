<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speed Simulation — Strong VPN Shield Demo</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <p class="demo-banner" role="note">
        Simulation only — displayed values are generated examples, not
        measurements.
      </p>

      <section class="panel" aria-labelledby="page-title">
        <div class="logo" aria-hidden="true">🚀</div>
        <p class="eyebrow">Prototype feature</p>
        <h1 id="page-title">Speed simulation</h1>
        <p class="intro">
          Preview how a future speed-test result could be presented.
        </p>

        <div id="speedStatus" class="result" aria-live="polite">
          Ready to generate sample values.
        </div>
        <button id="speedTestBtn" class="button button--primary" type="button">
          Run simulation
        </button>
        <a class="button button--link" href="index.html">← Back to demo</a>
      </section>
    </main>
  </body>
</html>
