<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Locations — Strong VPN Shield Demo</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <p class="demo-banner" role="note">
        Demo locations only — no VPN servers are contacted.
      </p>

      <section class="panel" aria-labelledby="page-title">
        <div class="logo" aria-hidden="true">🌍</div>
        <p class="eyebrow">Prototype control</p>
        <h1 id="page-title">Choose a location</h1>
        <p class="intro">
          Select a location to see how the planned interface behaves.
        </p>

        <div class="choice-grid" id="serverList">
          <button type="button" data-server="United States">
            🇺🇸 United States
          </button>
          <button type="button" data-server="Canada">🇨🇦 Canada</button>
          <button type="button" data-server="United Kingdom">
            🇬🇧 United Kingdom
          </button>
          <button type="button" data-server="Japan">🇯🇵 Japan</button>
          <button type="button" data-server="Australia">🇦🇺 Australia</button>
          <button type="button" data-server="Germany">🇩🇪 Germany</button>
          <button type="button" data-server="France">🇫🇷 France</button>
          <button type="button" data-server="Brazil">🇧🇷 Brazil</button>
        </div>

        <a class="button button--primary button--link" href="index.html"
          >← Back to demo</a
        >
      </section>
    </main>
  </body>
</html>
